# Run `fly launch --copy-config` from the server/ directory; it asks for a unique app name.
app = "mjolnir-relay"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  # Keep the storage cap below the volume size (see README).
  MJOLNIR_MAX_STORAGE_MB = "2048"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/health"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"
